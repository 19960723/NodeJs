version: '3.8'

services:
  # ==============================
  # NestJS 应用服务
  # ==============================
  app:
    container_name: nest-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - '${PORT:-3000}:3000'
    # 让容器可以访问宿主机 IP (host.docker.internal)
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      - NODE_ENV=production
      # 引用外部 .env 文件中的变量
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      # Redis 配置
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - nest-net

networks:
  nest-net:
    driver: bridge
